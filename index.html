<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header>
            <h1>Online Registration</h1>
            <p>Create your account by completing the form below.</p>
        </header>

        <form action="#" method="post">
            <fieldset>
                <legend>Personal Information</legend>

                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="first-name" autocomplete="given-name" required>

                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="last-name" autocomplete="family-name" required>

                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="" selected disabled>Select gender</option>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                    <option value="other">Other</option>
                    <option value="prefer-not-to-say">Prefer not to say</option>
                </select>

                <label for="date-of-birth">Date of Birth</label>
                <input type="date" id="date-of-birth" name="date-of-birth" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="e.g. +1 555 123 4567" required>
            </fieldset>

            <fieldset>
                <legend>Account Information</legend>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="name@example.com" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>

                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" minlength="8" autocomplete="new-password" required>

                <label for="address">Address</label>
                <textarea id="address" name="address" rows="4" autocomplete="street-address" required></textarea>
            </fieldset>

            <label for="terms">
                <input type="checkbox" id="terms" name="terms" required>
                I agree to the terms and conditions
            </label>

            <div>
                <button type="submit">Register</button>
                <button type="reset">Clear Form</button>
            </div>
        </form>
    </main>
</body>
</html>
